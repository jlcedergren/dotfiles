config-version = 2

after-startup-command = ['exec-and-forget sketchybar']

exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]


on-mode-changed = []

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 0
    inner.vertical =   0
    outer.left =       0
    outer.bottom =     0
    outer.top =        26
    outer.right =      0


[mode.main.binding]
    ctrl-cmd-alt-t = 'layout tiles horizontal vertical'
    ctrl-cmd-alt-a = 'layout accordion horizontal vertical'

    ctrl-cmd-alt-h = 'focus left'
    ctrl-cmd-alt-j = 'focus down'
    ctrl-cmd-alt-k = 'focus up'
    ctrl-cmd-alt-l = 'focus right'

    ctrl-cmd-alt-shift-h = 'move left'
    ctrl-cmd-alt-shift-j = 'move down'
    ctrl-cmd-alt-shift-k = 'move up'
    ctrl-cmd-alt-shift-l = 'move right'

    ctrl-cmd-alt-u = 'resize smart -50'
    ctrl-cmd-alt-i = 'resize smart +50'

    ctrl-cmd-alt-1 = 'workspace 1'
    ctrl-cmd-alt-2 = 'workspace 2'
    ctrl-cmd-alt-3 = 'workspace 3'
    ctrl-cmd-alt-4 = 'workspace 4'
    ctrl-cmd-alt-5 = 'workspace 5'
    ctrl-cmd-alt-6 = 'workspace 6'
    ctrl-cmd-alt-7 = 'workspace 7'
    ctrl-cmd-alt-8 = 'workspace 8'
    ctrl-cmd-alt-9 = 'workspace 9'

    ctrl-cmd-alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
    ctrl-cmd-alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
    ctrl-cmd-alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
    ctrl-cmd-alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
    ctrl-cmd-alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
    ctrl-cmd-alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
    ctrl-cmd-alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
    ctrl-cmd-alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
    ctrl-cmd-alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'

    ctrl-cmd-alt-tab = 'workspace-back-and-forth'
    ctrl-cmd-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    ctrl-cmd-alt-e = 'layout floating tiling'

    ctrl-cmd-alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']


    ctrl-cmd-alt-shift-h = ['join-with left', 'mode main']
    ctrl-cmd-alt-shift-j = ['join-with down', 'mode main']
    ctrl-cmd-alt-shift-k = ['join-with up', 'mode main']
    ctrl-cmd-alt-shift-l = ['join-with right', 'mode main']



